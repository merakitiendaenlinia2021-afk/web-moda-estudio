<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MODA ESTUDIO</title>
<meta name="description" content="Comfort-tech wear hecho en Colombia." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
ul{list-style:none}
:root{--bg:#F5F3EE;--bg-2:#EDEAE3;--ink:#0A0A0A;--ink-soft:#2C2825;--muted:#8B8680;--line:#DDD8CF;--accent:#6B5D4F;--white:#FFFFFF;--container:1400px;--gutter:clamp(16px,4vw,48px);--font-display:'Archivo',sans-serif;--font-editorial:'Instrument Serif',serif;--font-body:'Manrope',sans-serif}
.h-display{font-family:var(--font-display);font-weight:800;line-height:.95;letter-spacing:-.03em;text-transform:uppercase}
.eyebrow{font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.container{max-width:var(--container);margin:0 auto;padding:0 var(--gutter)}
.section{padding:clamp(60px,8vw,120px) 0}
.announce{background:var(--ink);color:var(--bg);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:10px 0;overflow:hidden;font-weight:500}
.announce-track{display:flex;gap:60px;white-space:nowrap;animation:marquee 30s linear infinite}
.announce-track span{flex-shrink:0}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.header{position:sticky;top:0;z-index:100;background:rgba(245,243,238,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:18px var(--gutter);max-width:var(--container);margin:0 auto}
.nav-left,.nav-right{display:flex;align-items:center;gap:28px}
.nav-right{justify-content:flex-end}
.nav-links{display:flex;gap:28px}
.nav-links a{font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;position:relative;transition:opacity .3s}
.nav-links a::after{content:'';position:absolute;left:0;bottom:-4px;width:0;height:1px;background:var(--ink);transition:width .3s ease}
.nav-links a:hover::after{width:100%}
.logo{font-family:var(--font-display);font-weight:900;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.logo .dot{color:var(--accent)}
.icon-btn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;transition:background .3s;position:relative}
.icon-btn:hover{background:var(--bg-2)}
.icon-btn svg{width:18px;height:18px}
.cart-count{position:absolute;top:2px;right:2px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.hamburger{display:none;width:30px;height:22px;flex-direction:column;justify-content:space-between;cursor:pointer}
.hamburger span{display:block;width:100%;height:1.5px;background:var(--ink);transition:transform .3s,opacity .3s}
.hamburger.open span:nth-child(1){transform:translateY(10px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:translateY(-10px) rotate(-45deg)}
.hero{position:relative;min-height:88vh;display:flex;align-items:flex-end;overflow:hidden;background:var(--ink)}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.65) contrast(1.05)}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.2) 0%,rgba(10,10,10,.55) 100%)}
.hero-content{position:relative;color:var(--bg);padding:0 var(--gutter) 80px;max-width:var(--container);margin:0 auto;width:100%}
.hero-eyebrow{color:rgba(245,243,238,.7);margin-bottom:24px;animation:fadeUp 1s .2s both}
.hero-title{font-size:clamp(48px,9vw,140px);margin-bottom:32px;animation:fadeUp 1.2s .4s both}
.hero-title .line{display:block}
.hero-title .italic{font-family:var(--font-editorial);font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.02em}
.hero-meta{display:flex;flex-wrap:wrap;gap:24px;align-items:center;animation:fadeUp 1.4s .6s both}
.btn{display:inline-flex;align-items:center;gap:12px;padding:16px 32px;background:var(--bg);color:var(--ink);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;transition:transform .3s,background .3s}
.btn:hover{transform:translateY(-2px);background:var(--white)}
.btn svg{transition:transform .3s}
.btn:hover svg{transform:translateX(4px)}
.btn-outline{background:transparent;color:var(--bg);border:1px solid rgba(245,243,238,.4)}
.btn-outline:hover{background:var(--bg);color:var(--ink)}
@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.features-marquee{background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;overflow:hidden}
.features-track{display:flex;gap:60px;white-space:nowrap;animation:marquee 40s linear infinite}
.features-track .feat{display:inline-flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--ink-soft);flex-shrink:0}
.features-track .feat::before{content:'◆';color:var(--accent);font-size:8px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:clamp(40px,6vw,72px);gap:24px;flex-wrap:wrap}
.section-title{font-size:clamp(36px,6vw,80px)}
.section-title .italic{font-family:var(--font-editorial);font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.02em}
.section-link{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;padding-bottom:4px;border-bottom:1px solid var(--ink);transition:gap .3s}
.section-link:hover{gap:14px}
.collections-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.collection-card{position:relative;aspect-ratio:3/4;overflow:hidden;cursor:pointer;background:var(--ink)}
.collection-card img{width:100%;height:100%;object-fit:cover;transition:transform .8s ease}
.collection-card:hover img{transform:scale(1.05)}
.collection-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,10,10,.7) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:32px;color:var(--bg)}
.collection-name{font-size:clamp(24px,3vw,36px);margin-bottom:8px}
.collection-desc{font-size:13px;color:rgba(245,243,238,.85);margin-bottom:16px;max-width:240px}
.collection-arrow{width:44px;height:44px;background:var(--bg);color:var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .3s}
.collection-card:hover .collection-arrow{transform:rotate(-45deg)}
.products-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 16px}
.product-card{cursor:pointer;transition:opacity .3s}
.product-media{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--bg-2);margin-bottom:16px}
.product-media img{width:100%;height:100%;object-fit:cover;transition:transform .6s,opacity .4s}
.product-media img.hover{position:absolute;inset:0;opacity:0}
.product-card:hover .product-media img.main{opacity:0}
.product-card:hover .product-media img.hover{opacity:1}
.product-card:hover .product-media img{transform:scale(1.03)}
.product-tag{position:absolute;top:12px;left:12px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px;z-index:2}
.product-tag.sale{background:var(--accent)}
.product-tag.bestseller{background:#5C5045}
.product-quick-add{position:absolute;bottom:12px;left:12px;right:12px;background:var(--bg);color:var(--ink);padding:12px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-align:center;border-radius:999px;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s,background .3s,color .3s;z-index:2}
.product-quick-add:hover{background:var(--ink);color:var(--bg)}
.product-card:hover .product-quick-add{opacity:1;transform:translateY(0)}
.product-info{padding:0 4px}
.product-name{font-size:14px;font-weight:600;margin-bottom:6px;letter-spacing:.01em}
.product-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.product-price{font-weight:500}
.product-price .old{text-decoration:line-through;color:var(--muted);margin-right:8px;font-size:12px}
.product-swatches{display:flex;gap:4px}
.swatch{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}
.manifesto{background:var(--ink);color:var(--bg)}
.manifesto-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.manifesto-image{aspect-ratio:4/5;overflow:hidden}
.manifesto-image img{width:100%;height:100%;object-fit:cover}
.manifesto-text .eyebrow{color:rgba(245,243,238,.5);margin-bottom:24px}
.manifesto-title{font-size:clamp(36px,5vw,64px);margin-bottom:32px}
.manifesto-body{font-size:17px;line-height:1.7;color:rgba(245,243,238,.85);margin-bottom:24px;max-width:520px}
.manifesto-pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}
.pill{border:1px solid rgba(245,243,238,.25);padding:10px 18px;border-radius:999px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.editorial-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}
.editorial-card{position:relative;aspect-ratio:16/11;overflow:hidden;color:var(--bg)}
.editorial-card img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.editorial-card:hover img{transform:scale(1.04)}
.editorial-card::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(10,10,10,.6) 100%)}
.editorial-content{position:absolute;bottom:0;left:0;right:0;padding:40px;z-index:2}
.editorial-title{font-size:clamp(24px,3vw,40px);margin-bottom:12px}
.editorial-sub{font-size:14px;opacity:.9;margin-bottom:20px}
.newsletter{background:var(--bg-2);text-align:center}
.newsletter-inner{max-width:640px;margin:0 auto}
.newsletter-title{font-size:clamp(32px,4vw,52px);margin-bottom:16px}
.newsletter-sub{color:var(--ink-soft);margin-bottom:32px;font-size:16px}
.newsletter-form{display:flex;gap:8px;max-width:480px;margin:0 auto;background:var(--bg);border-radius:999px;padding:6px;border:1px solid var(--line)}
.newsletter-form input{flex:1;padding:14px 20px;border:none;background:transparent;font:inherit;font-size:14px;color:var(--ink);outline:none}
.newsletter-form input::placeholder{color:var(--muted)}
.newsletter-form button{background:var(--ink);color:var(--bg);padding:14px 28px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;transition:background .3s}
.newsletter-form button:hover{background:var(--accent)}
.footer{background:var(--ink);color:var(--bg);padding:80px 0 32px}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:48px;padding-bottom:56px;border-bottom:1px solid rgba(245,243,238,.12)}
.footer-brand .logo{font-size:32px;margin-bottom:20px;display:inline-block}
.footer-brand p{color:rgba(245,243,238,.65);font-size:14px;max-width:320px;line-height:1.6;margin-bottom:24px}
.socials{display:flex;gap:12px}
.social-btn{width:40px;height:40px;border:1px solid rgba(245,243,238,.2);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:background .3s,border-color .3s}
.social-btn:hover{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.social-btn svg{width:16px;height:16px}
.footer-col h4{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:20px}
.footer-col ul li{margin-bottom:12px}
.footer-col ul a{color:rgba(245,243,238,.65);font-size:14px;transition:color .3s}
.footer-col ul a:hover{color:var(--bg)}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:32px;font-size:12px;color:rgba(245,243,238,.5);flex-wrap:wrap;gap:16px}
.payments{display:flex;gap:8px;align-items:center}
.pay-badge{background:rgba(245,243,238,.1);border-radius:4px;padding:4px 8px;font-size:10px;font-weight:700;letter-spacing:.05em}
.mobile-menu{position:fixed;top:0;left:0;width:100%;height:100vh;background:var(--bg);z-index:200;transform:translateX(-100%);transition:transform .4s cubic-bezier(.65,0,.35,1);padding:100px var(--gutter) 40px;overflow-y:auto}
.mobile-menu.open{transform:translateX(0)}
.mobile-menu .close-btn{position:absolute;top:22px;right:var(--gutter);width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.mobile-menu nav ul li{border-bottom:1px solid var(--line)}
.mobile-menu nav ul li a{display:block;padding:20px 0;font-family:var(--font-display);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:-.01em}
.mobile-menu .menu-bottom{margin-top:32px;display:flex;flex-direction:column;gap:12px}
.mobile-menu .menu-bottom a{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.cart-drawer{position:fixed;top:0;right:0;width:min(420px,100%);height:100vh;background:var(--bg);z-index:200;transform:translateX(100%);transition:transform .4s cubic-bezier(.65,0,.35,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.1)}
.cart-drawer.open{transform:translateX(0)}
.cart-overlay{position:fixed;inset:0;background:rgba(10,10,10,.4);opacity:0;visibility:hidden;transition:opacity .3s;z-index:150}
.cart-overlay.open{opacity:1;visibility:visible}
.cart-header{padding:24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.cart-header h3{font-family:var(--font-display);font-size:16px;text-transform:uppercase;letter-spacing:.05em}
.cart-body{flex:1;overflow-y:auto;padding:24px}
.cart-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.cart-item{display:grid;grid-template-columns:80px 1fr auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.cart-item img{width:80px;height:100px;object-fit:cover;background:var(--bg-2)}
.cart-item-info{display:flex;flex-direction:column;justify-content:space-between}
.cart-item-name{font-size:13px;font-weight:600}
.cart-item-meta{font-size:12px;color:var(--muted)}
.cart-item-price{font-size:13px;font-weight:600;align-self:start}
.cart-footer{border-top:1px solid var(--line);padding:24px}
.cart-total{display:flex;justify-content:space-between;margin-bottom:16px;font-size:15px;font-weight:600}
.cart-checkout{width:100%;background:var(--ink);color:var(--bg);padding:18px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;transition:background .3s}
.cart-checkout:hover{background:var(--accent)}
.reveal{opacity:0;transform:translateY(40px);transition:opacity .9s,transform .9s}
.reveal.visible{opacity:1;transform:translateY(0)}
.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
/* PRODUCT MODAL (detail view) */
.pdp-overlay{position:fixed;inset:0;background:rgba(10,10,10,.6);opacity:0;visibility:hidden;transition:opacity .3s;z-index:300}
.pdp-overlay.open{opacity:1;visibility:visible}
.pdp{position:fixed;top:0;right:0;width:min(960px,100%);height:100vh;background:var(--bg);z-index:310;transform:translateX(100%);transition:transform .4s cubic-bezier(.65,0,.35,1);display:flex;flex-direction:column;overflow:hidden}
.pdp.open{transform:translateX(0)}
.pdp-header{padding:18px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--bg);flex-shrink:0}
.pdp-header h3{font-family:'Archivo';font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.pdp-body{flex:1;overflow-y:auto;display:grid;grid-template-columns:1.1fr 1fr;gap:0}
.pdp-gallery{background:var(--bg-2);padding:24px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.pdp-main-img{aspect-ratio:4/5;background:var(--bg);overflow:hidden}
.pdp-main-img img{width:100%;height:100%;object-fit:cover}
.pdp-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pdp-thumb{aspect-ratio:1;background:var(--bg);overflow:hidden;cursor:pointer;border:2px solid transparent;transition:border-color .2s}
.pdp-thumb.active{border-color:var(--ink)}
.pdp-thumb img{width:100%;height:100%;object-fit:cover}
.pdp-info{padding:32px;overflow-y:auto}
.pdp-collection{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.pdp-name{font-family:'Archivo';font-size:clamp(22px,3vw,32px);font-weight:700;line-height:1.15;margin-bottom:16px;letter-spacing:-.01em}
.pdp-price{font-size:20px;font-weight:600;margin-bottom:20px}
.pdp-price .old{text-decoration:line-through;color:var(--muted);margin-right:10px;font-size:15px;font-weight:400}
.pdp-short{font-size:15px;color:var(--ink-soft);line-height:1.6;margin-bottom:24px}
.pdp-section{margin-bottom:24px}
.pdp-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin-bottom:10px}
.pdp-colors{display:flex;gap:8px}
.pdp-color{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid var(--line);transition:border-color .2s,transform .2s}
.pdp-color.selected{border-color:var(--ink);transform:scale(1.1)}
.pdp-sizes{display:flex;flex-wrap:wrap;gap:8px}
.pdp-size{padding:10px 16px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;background:var(--white)}
.pdp-size.selected{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pdp-add{width:100%;background:var(--ink);color:var(--bg);padding:16px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;transition:background .3s;margin-top:8px}
.pdp-add:hover{background:var(--accent)}
.pdp-long{margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}
.pdp-long-title{font-family:'Archivo';font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.pdp-long-body{font-size:14px;line-height:1.7;color:var(--ink-soft);white-space:pre-line}
.pdp-meta-info{margin-top:24px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:16px}
.pdp-close{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .2s}
.pdp-close:hover{background:var(--bg-2)}
@media (max-width:1024px){.nav-links,.icon-btn.search-btn{display:none}.hamburger{display:flex}.nav{grid-template-columns:auto 1fr auto}.nav-left .hamburger{order:-1}.logo-wrap{text-align:center}.products-grid{grid-template-columns:repeat(3,1fr)}.footer-grid{grid-template-columns:1fr 1fr;gap:40px}.manifesto-grid{gap:40px}.pdp-body{grid-template-columns:1fr}}
@media (max-width:768px){.collections-grid{grid-template-columns:1fr;gap:12px}.products-grid{grid-template-columns:repeat(2,1fr);gap:24px 12px}.manifesto-grid{grid-template-columns:1fr;gap:32px}.editorial-grid{grid-template-columns:1fr}.footer-grid{grid-template-columns:1fr 1fr;gap:32px}.footer-brand{grid-column:1/-1}.hero{min-height:78vh}.hero-content{padding-bottom:60px}.newsletter-form{flex-direction:column;background:transparent;border:none;padding:0}.newsletter-form input{background:var(--bg);border:1px solid var(--line);border-radius:999px}.section-head{flex-direction:column;align-items:flex-start}.pdp{width:100%}.pdp-info{padding:20px}}
@media (max-width:480px){.products-grid{grid-template-columns:1fr}.footer-grid{grid-template-columns:1fr;gap:32px}.footer-bottom{flex-direction:column;align-items:flex-start}.hero-title{font-size:56px}.collection-overlay{padding:20px}}
</style>
</head>
<body>

<div class="announce" id="announceBar"><div class="announce-track" id="announceTrack"></div></div>

<header class="header">
  <div class="nav">
    <div class="nav-left">
      <button class="hamburger" id="hamburger" aria-label="Menú"><span></span><span></span><span></span></button>
      <ul class="nav-links" id="navLinks"></ul>
    </div>
    <div class="logo-wrap"><a href="#" class="logo" id="brandLogo"></a></div>
    <div class="nav-right">
      <button class="icon-btn search-btn" aria-label="Buscar"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
      <a href="admin.html" class="icon-btn" aria-label="Cuenta"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
      <button class="icon-btn" id="cartBtn" aria-label="Carrito"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span class="cart-count" id="cartCount">0</span></button>
    </div>
  </div>
</header>

<div class="mobile-menu" id="mobileMenu">
  <button class="close-btn" id="closeMenu"><svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  <nav><ul id="mobileNavLinks"></ul></nav>

</div>

<section class="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <div class="hero-eyebrow eyebrow" id="heroEyebrow"></div>
    <h1 class="h-display hero-title" id="heroTitle"></h1>
    <div class="hero-meta">
      <a href="#productos" class="btn" id="heroCta1"><span></span><svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
      <a href="#nosotros" class="btn btn-outline" id="heroCta2"></a>
    </div>
  </div>
</section>

<section class="features-marquee"><div class="features-track" id="featuresTrack"></div></section>

<section class="section" id="colecciones">
  <div class="container">
    <div class="section-head reveal">
      <div><div class="eyebrow">— Colecciones</div><h2 class="h-display section-title">Diseñado para <span class="italic">moverte</span></h2></div>
    </div>
    <div class="collections-grid" id="collectionsGrid"></div>

</section>

<section class="section" id="productos" style="padding-top:0;">

      <div><div class="eyebrow">— Lo más vendido</div><h2 class="h-display section-title">Más <span class="italic">querido</span></h2></div>

  <div class="container">
    <div class="manifesto-grid">
      <div class="manifesto-image reveal"><img id="manifestoImg" src="" alt=""></div>
      <div class="manifesto-text reveal">
        <div class="eyebrow" id="manifestoEyebrow"></div>
        <h2 class="h-display manifesto-title" id="manifestoTitle"></h2>
        <p class="manifesto-body" id="manifestoBody1"></p>
        <p class="manifesto-body" id="manifestoBody2"></p>
        <div class="manifesto-pills" id="manifestoPills"></div>
      </div>

  </div>
</section>

  <div class="container">

  </div>
</section>

  <div class="container">
    <div class="newsletter-inner reveal">
      <div class="eyebrow" id="newsEyebrow"></div>
      <h2 class="h-display newsletter-title" id="newsTitle" style="margin-top:16px;"></h2>
      <p class="newsletter-sub" id="newsSub"></p>
      <form class="newsletter-form" name="newsletter" method="POST" data-netlify="true" onsubmit="event.preventDefault();alert('¡Gracias por suscribirte!');">
        <input type="hidden" name="form-name" value="newsletter">
        <input type="email" name="email" id="newsInput" required>
        <button type="submit" id="newsBtn"></button>
      </form>

</section>

<footer class="footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <a href="#" class="logo" id="footerLogo"></a>
        <p id="footerTagline"></p>
        <div class="socials" id="footerSocials"></div>
      </div>
      <div id="footerColumns" style="display:contents;"></div>
    </div>
    <div class="footer-bottom">
      <div id="footerCopy"></div>
      <div class="payments" id="footerPayments"></div>
    </div>
  </div>
</footer>

<!-- CART -->
<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-header"><h3>Tu carrito</h3><button class="icon-btn" id="closeCart"><svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="cart-body" id="cartBody"><div class="cart-empty">Tu carrito está vacío.</div></div>
  <div class="cart-footer"><div class="cart-total"><span>Subtotal</span><span id="cartTotal">$0 COP</span></div><button class="cart-checkout">Finalizar compra</button></div>
</aside>

<!-- PRODUCT DETAIL MODAL -->
<div class="pdp-overlay" id="pdpOverlay"></div>
<aside class="pdp" id="pdpDrawer">
  <div class="pdp-header">
    <h3 id="pdpBreadcrumb">Producto</h3>
    <button class="pdp-close" id="pdpClose"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="pdp-body" id="pdpBody"></div>
</aside>

<script src="products.js"></script>
<script>
function formatCOP(n){return '$'+(n||0).toLocaleString('es-CO')+' COP'}
function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}

const cfg=window.SITE_CONFIG||{};
const brand=`${escapeHTML(cfg.brandName||'MODA ESTUDIO')}<span class="dot">${escapeHTML(cfg.brandDot||'.')}</span>`;
document.getElementById('brandLogo').innerHTML=brand;
document.getElementById('footerLogo').innerHTML=brand;
document.getElementById('footerTagline').textContent=cfg.tagline||'';
document.title=`${cfg.brandName||'MODA ESTUDIO'}`;

const ann=cfg.announcements||[];
if(cfg.announcementBarVisible===false){document.getElementById('announceBar').style.display='none'}
else{document.getElementById('announceTrack').innerHTML=[...ann,...ann].map(t=>`<span>${escapeHTML(t)}</span><span>◆</span>`).join('')}

// NAV
const navItems=cfg.navigation||[];
document.getElementById('navLinks').innerHTML=navItems.map(n=>`<li><a href="${escapeHTML(n.href)}">${escapeHTML(n.label)}</a></li>`).join('');
document.getElementById('mobileNavLinks').innerHTML=navItems.map(n=>`<li><a href="${escapeHTML(n.href)}">${escapeHTML(n.label)}</a></li>`).join('');

const hero=cfg.hero||{};
document.getElementById('heroBg').style.backgroundImage=`url('${hero.image||''}')`;
document.getElementById('heroEyebrow').textContent=hero.eyebrow||'';
document.getElementById('heroTitle').innerHTML=`<span class="line">${escapeHTML(hero.titleLine1||'')}</span><span class="line"><span class="italic">${escapeHTML(hero.titleLine2Italic||'')}</span> ${escapeHTML(hero.titleLine2Rest||'')}</span>`;
document.querySelector('#heroCta1 span').textContent=hero.ctaPrimary||'Comprar ahora';
document.getElementById('heroCta2').textContent=hero.ctaSecondary||'Nuestra filosofía';
if(!hero.ctaPrimary)document.getElementById('heroCta1').style.display='none';
if(!hero.ctaSecondary)document.getElementById('heroCta2').style.display='none';

const feats=cfg.features||[];
document.getElementById('featuresTrack').innerHTML=[...feats,...feats].map(f=>`<span class="feat">${escapeHTML(f)}</span>`).join('');

const socials=cfg.socials||{};
const socialIcons={
  instagram:'<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><line x1="17.5" y1="6.5" x2="17.5" y2="6.5"/></svg>',
  tiktok:'<svg fill="currentColor" viewBox="0 0 24 24"><path d="M19.6 6.3a4.85 4.85 0 0 1-3-1.1 4.85 4.85 0 0 1-1.85-3H11.5v13.2a2.6 2.6 0 1 1-2.6-2.6c.3 0 .6 0 .8.1V9.6a6 6 0 1 0 5 5.9V9.3a7.2 7.2 0 0 0 4.3 1.4z"/></svg>',
  linkedin:'<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>'
};
document.getElementById('footerSocials').innerHTML=Object.keys(socials).map(k=>`<a href="${escapeHTML(socials[k])}" class="social-btn" target="_blank" rel="noopener">${socialIcons[k]||''}</a>`).join('');

// MANIFESTO
const m=cfg.manifesto||{};
if(m.visible===false){document.getElementById('nosotros').style.display='none'}
else{
  document.getElementById('manifestoImg').src=m.image||'';
  document.getElementById('manifestoEyebrow').textContent=m.eyebrow||'— Nuestra filosofía';
  document.getElementById('manifestoTitle').innerHTML=`${escapeHTML(m.title||'')} <span class="italic">${escapeHTML(m.titleItalic||'')}</span>`;
  document.getElementById('manifestoBody1').textContent=m.body1||'';
  document.getElementById('manifestoBody2').textContent=m.body2||'';
  if(!m.body2)document.getElementById('manifestoBody2').style.display='none';
  document.getElementById('manifestoPills').innerHTML=(m.pills||[]).map(p=>`<span class="pill">${escapeHTML(p)}</span>`).join('');
}

// EDITORIAL
const ed=cfg.editorial||{};
if(ed.visible===false||!(ed.blocks||[]).length){document.getElementById('editorialSection').style.display='none'}
else{
  const blocks=(ed.blocks||[]).filter(b=>b.visible!==false);
  document.getElementById('editorialGrid').innerHTML=blocks.map(b=>`
    <a href="#" class="editorial-card reveal">
      <img src="${escapeHTML(b.image||'')}" alt="${escapeHTML(b.title||'')}">
      <div class="editorial-content">
        <h3 class="h-display editorial-title">${escapeHTML(b.title||'')} ${b.italic?`<span class="italic">${escapeHTML(b.italic)}</span>`:''}</h3>
        <p class="editorial-sub">${escapeHTML(b.subtitle||'')}</p>
        <span class="section-link" style="color:var(--bg);border-color:var(--bg);">${escapeHTML(b.linkText||'Ver más')} <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>
      </div>
    </a>`).join('');
}

// NEWSLETTER
const nl=cfg.newsletter||{};
if(nl.visible===false){document.getElementById('newsletterSection').style.display='none'}
else{
  document.getElementById('newsEyebrow').textContent=nl.eyebrow||'— Únete';
  document.getElementById('newsTitle').innerHTML=`${escapeHTML(nl.title||'')} <span class="italic">${escapeHTML(nl.titleItalic||'')}</span> ${escapeHTML(nl.titleRest||'')}`;
  document.getElementById('newsSub').textContent=nl.subtitle||'';
  document.getElementById('newsInput').placeholder=nl.placeholder||'Tu correo electrónico';
  document.getElementById('newsBtn').textContent=nl.buttonText||'Suscribirme';
}

// FOOTER
const ft=cfg.footer||{};
document.getElementById('footerColumns').innerHTML=(ft.columns||[]).map(c=>`
  <div class="footer-col">
    <h4>${escapeHTML(c.title||'')}</h4>
    <ul>${(c.links||[]).map(l=>`<li><a href="${escapeHTML(l.href||'#')}">${escapeHTML(l.label||'')}</a></li>`).join('')}</ul>
  </div>`).join('');
document.getElementById('footerPayments').innerHTML=(ft.payments||[]).map(p=>`<span class="pay-badge">${escapeHTML(p)}</span>`).join('');
const copySuffix=ft.copyrightSuffix||'Hecho en Colombia';
document.getElementById('footerCopy').textContent=`© ${new Date().getFullYear()} ${cfg.brandName||'MODA ESTUDIO'} · ${copySuffix}`;

// Collections
const collections=window.COLLECTIONS||[];
document.getElementById('collectionsGrid').innerHTML=collections.map(c=>`
  <a href="#" class="collection-card reveal">
    <img src="${escapeHTML(c.image)}" alt="${escapeHTML(c.name)}" loading="lazy">
    <div class="collection-overlay">
      <h3 class="h-display collection-name">${escapeHTML(c.name)}</h3>
      <p class="collection-desc">${escapeHTML(c.description)}</p>
      <div class="collection-arrow"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
    </div>
  </a>`).join('')||'<div class="empty-state">Aún no hay colecciones.</div>';

// Products - normalize old/new format
function getProductImages(p){
  if(Array.isArray(p.images)&&p.images.length>0)return p.images;
  const imgs=[];
  if(p.image)imgs.push(p.image);
  if(p.imageHover)imgs.push(p.imageHover);
  return imgs.length?imgs:['https://picsum.photos/seed/'+p.id+'/600/750?grayscale'];
}

const products=(window.PRODUCTS||[]).filter(p=>p.active!==false);
const tagLabels={new:'Nuevo',sale:'Sale',bestseller:'Bestseller'};

document.getElementById('productsGrid').innerHTML=products.map(p=>{
  const imgs=getProductImages(p);
  const priceHtml=p.oldPrice?`<span class="old">${formatCOP(p.oldPrice)}</span>${formatCOP(p.price)}`:formatCOP(p.price);
  const tagHtml=p.tag?`<span class="product-tag ${p.tag}">${tagLabels[p.tag]||p.tag}</span>`:'';
  const swatches=(p.colors||[]).slice(0,5).map(c=>`<span class="swatch" style="background:${escapeHTML(c)}${c==='#FFFFFF'||c==='#fff'?';border:1px solid #ddd':''}"></span>`).join('');
  return `<article class="product-card reveal" data-id="${escapeHTML(p.id)}">
    <div class="product-media">
      ${tagHtml}
      <img class="main" src="${escapeHTML(imgs[0])}" alt="${escapeHTML(p.name)}" loading="lazy">
      ${imgs[1]?`<img class="hover" src="${escapeHTML(imgs[1])}" alt="" loading="lazy">`:''}
      <button class="product-quick-add">Ver producto</button>
    </div>
    <div class="product-info">
      <h3 class="product-name">${escapeHTML(p.name)}</h3>
      <div class="product-meta"><span class="product-price">${priceHtml}</span><div class="product-swatches">${swatches}</div></div>
    </div>
  </article>`;
}).join('')||'<div class="empty-state">Aún no hay productos.</div>';

// Mobile menu
const hamburger=document.getElementById('hamburger'),mobileMenu=document.getElementById('mobileMenu');
hamburger.onclick=()=>{mobileMenu.classList.toggle('open');hamburger.classList.toggle('open');document.body.style.overflow=mobileMenu.classList.contains('open')?'hidden':''};
document.getElementById('closeMenu').onclick=()=>{mobileMenu.classList.remove('open');hamburger.classList.remove('open');document.body.style.overflow=''};
mobileMenu.querySelectorAll('a').forEach(a=>a.onclick=()=>{mobileMenu.classList.remove('open');hamburger.classList.remove('open');document.body.style.overflow=''});

// Cart
const cartBtn=document.getElementById('cartBtn'),cartDrawer=document.getElementById('cartDrawer'),cartOverlay=document.getElementById('cartOverlay'),cartBody=document.getElementById('cartBody'),cartCount=document.getElementById('cartCount'),cartTotal=document.getElementById('cartTotal');
let cart=[];
function openCart(){cartDrawer.classList.add('open');cartOverlay.classList.add('open');document.body.style.overflow='hidden'}
function shutCart(){cartDrawer.classList.remove('open');cartOverlay.classList.remove('open');document.body.style.overflow=''}
cartBtn.onclick=openCart;document.getElementById('closeCart').onclick=shutCart;cartOverlay.onclick=shutCart;
function renderCart(){
  cartBody.innerHTML=cart.length===0?'<div class="cart-empty">Tu carrito está vacío.</div>':cart.map((it,i)=>`<div class="cart-item"><img src="${escapeHTML(it.image)}" alt=""><div class="cart-item-info"><div><div class="cart-item-name">${escapeHTML(it.name)}</div><div class="cart-item-meta">${it.size?'Talla: '+escapeHTML(it.size)+' · ':''}Cant: ${it.qty}</div></div><button onclick="removeFromCart(${i})" style="text-align:left;font-size:11px;color:var(--muted);text-decoration:underline;">Quitar</button></div><div class="cart-item-price">${formatCOP(it.price*it.qty)}</div></div>`).join('');
  cartTotal.textContent=formatCOP(cart.reduce((s,i)=>s+i.price*i.qty,0));
  cartCount.textContent=cart.reduce((s,i)=>s+i.qty,0);
}
window.removeFromCart=i=>{cart.splice(i,1);renderCart()};

// ============ PDP (Product Detail) ============
const pdp=document.getElementById('pdpDrawer'),pdpOverlay=document.getElementById('pdpOverlay'),pdpBody=document.getElementById('pdpBody'),pdpBreadcrumb=document.getElementById('pdpBreadcrumb');
let pdpProduct=null,pdpSelectedColor=null,pdpSelectedSize=null,pdpCurrentImg=0;

function openPDP(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  pdpProduct=p;
  pdpSelectedColor=(p.colors||[])[0]||null;
  pdpSelectedSize=(p.sizes||[])[0]||null;
  pdpCurrentImg=0;
  const col=collections.find(c=>c.id===p.collection);
  pdpBreadcrumb.textContent=col?col.name:'Producto';
  renderPDP();
  pdp.classList.add('open');pdpOverlay.classList.add('open');document.body.style.overflow='hidden';
}
function shutPDP(){pdp.classList.remove('open');pdpOverlay.classList.remove('open');document.body.style.overflow=''}
document.getElementById('pdpClose').onclick=shutPDP;pdpOverlay.onclick=shutPDP;

function renderPDP(){
  const p=pdpProduct;if(!p)return;
  const imgs=getProductImages(p);
  const priceHtml=p.oldPrice?`<span class="old">${formatCOP(p.oldPrice)}</span>${formatCOP(p.price)}`:formatCOP(p.price);
  pdpBody.innerHTML=`
    <div class="pdp-gallery">
      <div class="pdp-main-img"><img src="${escapeHTML(imgs[pdpCurrentImg]||imgs[0])}" alt="${escapeHTML(p.name)}"></div>
      ${imgs.length>1?`<div class="pdp-thumbs">${imgs.map((src,i)=>`<div class="pdp-thumb ${i===pdpCurrentImg?'active':''}" onclick="pdpSelectImg(${i})"><img src="${escapeHTML(src)}" alt=""></div>`).join('')}</div>`:''}
    </div>
    <div class="pdp-info">
      ${p.collection?`<div class="pdp-collection">${escapeHTML((collections.find(c=>c.id===p.collection)||{}).name||'')}</div>`:''}
      <h2 class="pdp-name">${escapeHTML(p.name)}</h2>
      <div class="pdp-price">${priceHtml}</div>
      ${p.shortDescription?`<p class="pdp-short">${escapeHTML(p.shortDescription)}</p>`:''}
      ${(p.colors&&p.colors.length)?`<div class="pdp-section"><div class="pdp-label">Color: <span style="font-weight:400;text-transform:none;letter-spacing:0;">${escapeHTML(pdpSelectedColor||'')}</span></div><div class="pdp-colors">${p.colors.map(c=>`<div class="pdp-color ${c===pdpSelectedColor?'selected':''}" style="background:${escapeHTML(c)}${c==='#FFFFFF'?';border-color:#ccc':''}" onclick="pdpSelectColor('${escapeHTML(c)}')"></div>`).join('')}</div></div>`:''}
      ${(p.sizes&&p.sizes.length)?`<div class="pdp-section"><div class="pdp-label">Talla: <span style="font-weight:400;text-transform:none;letter-spacing:0;">${escapeHTML(pdpSelectedSize||'')}</span></div><div class="pdp-sizes">${p.sizes.map(s=>`<div class="pdp-size ${s===pdpSelectedSize?'selected':''}" onclick="pdpSelectSize('${escapeHTML(s)}')">${escapeHTML(s)}</div>`).join('')}</div></div>`:''}
      <button class="pdp-add" onclick="pdpAddToCart()">Agregar al carrito · ${formatCOP(p.price)}</button>
      ${p.longDescription?`<div class="pdp-long"><div class="pdp-long-title">Detalles</div><div class="pdp-long-body">${escapeHTML(p.longDescription)}</div></div>`:''}
      ${p.sku?`<div class="pdp-meta-info"><span>SKU: ${escapeHTML(p.sku)}</span></div>`:''}
    </div>`;
}
window.pdpSelectImg=i=>{pdpCurrentImg=i;renderPDP()};
window.pdpSelectColor=c=>{pdpSelectedColor=c;renderPDP()};
window.pdpSelectSize=s=>{pdpSelectedSize=s;renderPDP()};
window.pdpAddToCart=()=>{
  const p=pdpProduct;if(!p)return;
  const imgs=getProductImages(p);
  const key=p.id+'|'+pdpSelectedColor+'|'+pdpSelectedSize;
  const existing=cart.find(i=>i.key===key);
  if(existing)existing.qty++;
  else cart.push({key,id:p.id,name:p.name,price:p.price,image:imgs[0],color:pdpSelectedColor,size:pdpSelectedSize,qty:1});
  renderCart();
  shutPDP();
  setTimeout(openCart,200);
};

// Open PDP on card click
document.querySelectorAll('.product-card').forEach(card=>{
  card.addEventListener('click',e=>{e.preventDefault();openPDP(card.dataset.id)});
});

// Scroll reveal
const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -60px 0px'});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
</script>
</body>
</html>
